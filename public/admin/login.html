<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/normalize.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <title>Acceso Admin - DuotechBros</title>
    <script src="/js/config.js"></script>
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="login-logo">
          <i class="fas fa-lock"></i>
        </div>
        <h1 class="login-title">DuotechBros</h1>
        <p class="login-subtitle">Panel de Administración</p>

        <form class="login-form" id="form-login">
          <div>
            <label for="usuario">Usuario</label>
            <input
              type="text"
              id="usuario"
              name="usuario"
              placeholder="Ingresá tu usuario"
              required
              autocomplete="username"
            />
          </div>

          <div>
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ingresá tu contraseña"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="login-btn">Iniciar Sesión</button>
        </form>

        <div id="login-mensaje" class="login-mensaje"></div>

        <p class="login-footer">
          <a href="../index.html">
            <i class="fas fa-arrow-left"></i> Volver al sitio
          </a>
        </p>
      </div>
    </div>

    <script src="../js/admin.js"></script>
  </body>
</html>
