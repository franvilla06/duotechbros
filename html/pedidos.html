<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/pie_encabezado.css">
    <link rel="stylesheet" href="../css/pedidos.css">
    <title>Pedidos - DuoTechBros</title>
</head>
<body>

    <!-- header -->
    <header>
        <nav>
            <div class="nav-brand">DuotechBros</div>
            <div class="nav-menu">
                <!-- En cada página, cambiar la clase active al enlace correspondiente -->
                <a class="nav-link" href="inicio.html">Inicio</a>
                <a class="nav-link" href="portafolio.html">Portafolio</a>
                <a class="nav-link" href="tienda.html">Tienda</a>
                <a class="nav-link active" href="pedidos.html">Contacto / Reparación</a>
                <a class="nav-link" href="#">Admin</a>
            </div>
        </nav>
    </header>
    <!-- contenido principal: formulario -->
    <main class="container">
        <!-- formulario de reoaraciones -->
        <h1>Solicitar reparación</h1>
        <form id="form-pedido">
            <label for="nombre_cliente">Nombre completo:</label>
            <input type="text" id="nombre_cliente" name="nombre_cliente" required>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono">

            <label for="modelo_celular">Modelo del celular:</label>
            <input type="text" id="modelo_celular" name="modelo_celular" required>

            <label for="descripcion_problema">Descripción del problema:</label>
            <textarea id="descripcion_problema" name="descripcion_problema" rows="4" required></textarea>

            <button type="submit">Enviar pedido</button>
        </form>

        <div id="mensaje" class="mensaje" style="display: none;"></div>
    </main>
    
    <!-- footer -->
    <footer>
        <p>© 2024 DuotechBros. Todos los derechos reservados.</p>
    </footer>

    <script src="../js/Script_Pedidos.js"></script>
    
</body>
</html>
